# SecureVault Docker Compose Configuration
# By Nextendo x Micka Delcato
# Version: 2.0.0

version: '3.8'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:15-alpine
    container_name: securevault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-vault}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vault_secure_password}
      POSTGRES_DB: ${DB_NAME:-securevault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - securevault-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vault} -d ${DB_NAME:-securevault}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Backend API (Node.js Express)
  # ========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securevault-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${DB_USER:-vault}:${DB_PASSWORD:-vault_secure_password}@postgres:5432/${DB_NAME:-securevault}
      JWT_SECRET: ${JWT_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      REAL_EMAIL_ENCRYPTION_KEY: ${REAL_EMAIL_ENCRYPTION_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - securevault-network
    volumes:
      - uploads_data:/app/uploads
      - extensions_data:/app/extensions
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Frontend (React with Nginx)
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    container_name: securevault-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    depends_on:
      - backend
    networks:
      - securevault-network

  # ========================================
  # Mail Server (Postfix)
  # ========================================
  mail:
    build:
      context: ./mail
      dockerfile: Dockerfile
    container_name: securevault-mail
    restart: unless-stopped
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN}
      DATABASE_URL: postgresql://${DB_USER:-vault}:${DB_PASSWORD:-vault_secure_password}@postgres:5432/${DB_NAME:-securevault}
    ports:
      - "25:25"
      - "587:587"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - securevault-network
    volumes:
      - mail_data:/var/mail
      - mail_config:/etc/postfix

# ========================================
# Networks
# ========================================
networks:
  securevault-network:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
  mail_data:
  mail_config:
  uploads_data:
  extensions_data:
