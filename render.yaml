services:
  - type: web
    name: securevault
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/health
    autoDeploy: true

  - type: postgres
    name: securevault-db
    plan: standard
    ipAllowList: []
