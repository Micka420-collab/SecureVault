# Prometheus Configuration - SecureVault by Nextendo x Micka Delcato
# Copier ce fichier dans un dossier "monitoring/"

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'securevault-api'
    static_configs:
      - targets: ['backend:3001']
    metrics_path: /api/metrics

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
